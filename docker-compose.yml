services:
  fing-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: fing-mcp:latest
    restart: unless-stopped
    environment:
      FING_API_BASE_URL: "${FING_API_BASE_URL:-http://fing-agent:48080}"
      FING_API_KEY: "${FING_API_KEY}"
      FING_TIMEOUT: "${FING_TIMEOUT:-10}"
      FING_RETRIES: "${FING_RETRIES:-3}"
      OP_CONNECT_HOST: "http://op-connect:8080"
      OP_CONNECT_TOKEN: "${OP_CONNECT_TOKEN}"
    ports:
      - "8000:8000"
    depends_on:
      op-connect:
        condition: service_healthy
    networks:
      - fing-net

  op-connect:
    image: 1password/connect-api:latest
    restart: unless-stopped
    environment:
      OP_SESSION: "${OP_SESSION}"
    volumes:
      - op-data:/home/opuser/.op/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - fing-net

networks:
  fing-net:

volumes:
  op-data:
